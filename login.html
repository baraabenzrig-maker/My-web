<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدخول إلى Connect+</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
    <h1>Connect<span>+</span></h1>
    <a href="index.html" class="main-button">الرئيسية</a>
</header>

<main class="container">
    <div class="card">
        <h2>مرحبا بيك 👋</h2>
        <p>اكتب الاسم اللي تحب يظهر للناس.</p>

        <input id="username" type="text" placeholder="اسم المستخدم">

        <button onclick="login()">دخول</button>
        <p id="message"></p>
    </div>
</main>

<script>
function login() {
    const name = document.getElementById("username").value.trim();

    if (name.length < 2) {
        document.getElementById("message").textContent =
            "اكتب اسم فيه حرفين على الأقل.";
        return;
    }

    localStorage.setItem("connectplus_name", name);
    window.location.href = "profile.html";
}
</script>

</body>
</html>
